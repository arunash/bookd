version: 2
updates:
  # The app (Next.js / Prisma / etc.)
  - package-ecosystem: "npm"
    directory: "/web"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 8
    labels:
      - "dependencies"
    groups:
      # batch low-risk updates into one PR to cut noise
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"

  # The scaffolder CLI
  - package-ecosystem: "npm"
    directory: "/create-bookd"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
